services:
  genesis:
    build:
      context: .
      dockerfile: Dockerfile.postgres
    environment:
      DATABASE_URL: postgresql+psycopg://genesis:${POSTGRES_PASSWORD}@postgres:5432/genesis
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: genesis
      POSTGRES_USER: genesis
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U genesis -d genesis"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
